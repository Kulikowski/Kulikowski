name: Update latest writing

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-latest-writing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh posts from the blog feed
        shell: pwsh
        run: ./scripts/update-posts.ps1
      - name: Commit updated links
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update latest writing'
          git push
